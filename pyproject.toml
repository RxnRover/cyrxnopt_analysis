[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrxnopt_analysis"
description = "Results analysis for CyRxnOpt benchmarking trials."
authors = [
    { name = "dulithaprasanna", email = "dulithaprasanna@gmail.com" },
    { name = "zachcran", email = "zachcran@iastate.edu" },
]
maintainers = [{ name = "zachcran", email = "zachcran@iastate.edu" }]
dependencies = [
    "numpy",
    "pandas",
    "benchmarking @ git+https://github.com/RxnRover/benchmarking.git",
]

dynamic = ["version"]
requires-python = ">=3.10, <4"
license = "MIT"
license-files = ["LICENSE.txt"]
readme = { file = "README.rst", content-type = "text/x-rst" }
keywords = [
    "analysis", "scientific software"
]
classifiers = [
    "Private :: Do Not Upload",

    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Typing :: Typed",

    # Intended audience tags and other information about what this project is
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",

    # Supported Python versions and operating systems
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://RxnRover.github.io/cyrxnopt_analysis"
Source = "https://github.com/RxnRover/cyrxnopt_analysis"
Tracker = "https://github.com/RxnRover/cyrxnopt_analysis/issues"
Download = "https://github.com/RxnRover/cyrxnopt_analysis/archive/refs/heads/main.zip"
Changelog = "https://github.com/RxnRover/cyrxnopt_analysis/releases/latest"

[project.scripts]
analyze_results = "cyrxnopt_analysis.apps.main:main"

# Install these optional development dependencies with pip's --group flag while
# in the project root directory.
# Example: pip install --group dev
[dependency-groups]
docs = ["sphinx>=3.2.1", "sphinx_rtd_theme"]
test = [
    "setuptools",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]
dev = [
    "tox",
    "pre-commit",
    { include-group = "docs" },
    { include-group = "test" },
]

[tool.setuptools_scm]
# For smarter version schemes and other configuration options,
# check out https://github.com/pypa/setuptools_scm
version_scheme = "no-guess-dev"

[tool.black]
line-length = 80


[tool.docstrfmt]
line_length = 80

[tool.isort]
profile = "black"
known_first_party = "cyrxnopt_analysis"
multi_line_output = 3
line_length = 80

[tool.pytest.ini_options]
# Enable log display during test runs with --strict-markers
# See: https://docs.pytest.org/en/latest/how-to/logging.html#live-logs
addopts = "--cov cyrxnopt_analysis --cov-report term-missing --verbose --strict-markers"
norecursedirs = "dist build .tox"
testpaths = ["tests"]
log_cli = true

[tool.coverage.run]
branch = true
source = ["cyrxnopt_analysis"]
# omit = bad_file.py

[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
] # Regexes for lines to exclude from consideration

[tool.mypy]
# Disable for now, this code base was written before we were using type hints and must
# be migrated
disallow_untyped_defs = false
# Any changes to exclude here need to be made in .pre-commit-config.yaml, too!
# This exclude list doesn't work because of the way pre-commit invokes mypy
exclude = ['^setup.py$', '^build', '^venv', '^docs', '^tests']

[[tool.mypy.overrides]]
module = "cyrxnopt_analysis.*"
# Disable for now, this code base was written before we were using type hints and must
# be migrated
disallow_incomplete_defs = false
